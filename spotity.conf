# 2025.6.27 部分解锁 premium，音质不能设置为超高
# 仓库地址 https://github.com/app2smile/rules
# 功能: 去除播放广告、歌手/专辑列表正常展示、去除随机播放

[URL Rewrite]
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ header-del If-None-Match
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/ header-del If-None-Match
^https:\/\/((?:spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com))(?:\:443)?\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/([^?]+)\?([^#]*?)platform=iphone([^#]*)$ https://$1/$2/$3?$4platform=ipad$5 header

[Script]
spotify-proto = type=http-response,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$,requires-body=true,binary-body-mode=true,max-size=1048576,script-path=https://raw.githubusercontent.com/fyylflh/nextinrule/main/spotify-proto.js,enable=true

[MITM]
hostname = spclient.wg.spotify.com, *spclient.spotify.com
