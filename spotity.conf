# 2025.6.27 部分解锁premium,音质不能设置为超高(建议登录后再打开脚本,重启app等待脚本生效)
# 仓库地址 https://github.com/daozen/rules
# Nextin 版：放宽 Spotify 域名匹配，优先确保 protobuf 响应脚本能命中。

[URL Rewrite]
^https:\/\/(((?:[^\/]+\.)*spotify\.com)(?::443)?\/(?:artistview\/v1\/artist|album-entity-view\/v2\/album)\/.*[?&])platform=iphone(.*)$ https://$1platform=ipad$3 302

[Script]
spotify-proto = type=http-response,pattern=^https:\/\/(?:[^\/]+\.)*spotify\.com(:443)?\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)(\?.*)?$,requires-body=1,binary-body-mode=1,max-size=0,script-path=https://raw.githubusercontent.com/fyylflh/nextinrule/main/spotify-proto.js,script-update-interval=0,enable=true

[MITM]
hostname = spclient.wg.spotify.com, *.wg.spotify.com, *.spotify.com, *spclient.spotify.com
