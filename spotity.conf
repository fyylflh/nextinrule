# 2025.6.27 部分解锁premium,音质不能设置为超高(建议登录后再打开脚本,重启app等待脚本生效)
# 仓库地址 https://github.com/daozen/rules
# Nextin 版：只保留歌手/专辑页平台改写 + http-response protobuf 改写，避免影响登录和播放链路。

[URL Rewrite]
^https:\/\/((?:(?:spclient|.*-spclient)\.wg\.spotify\.com|.*-spclient\.spotify\.com)(?::443)?\/(?:artistview\/v1\/artist|album-entity-view\/v2\/album)\/.*[?&])platform=iphone(.*)$ https://$1platform=ipad$2 302

[Script]
spotify-proto = type=http-response,pattern=^https:\/\/((?:spclient|.*-spclient)\.wg\.spotify\.com|.*-spclient\.spotify\.com)(:443)?\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)(\?.*)?$,requires-body=true,binary-body-mode=true,max-size=1048576,script-path=https://raw.githubusercontent.com/fyylflh/nextinrule/main/spotify-proto.js,script-update-interval=0,enable=true

[MITM]
hostname = spclient.wg.spotify.com, *spclient.wg.spotify.com, *spclient.spotify.com
