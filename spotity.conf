# 2025.6.27 部分解锁premium,音质不能设置为超高(建议登录后再打开脚本,重启app等待脚本生效)
# 仓库地址 https://github.com/daozen/rules
# Nextin 版仅保留 http-response protobuf 改写，避免 URL Rewrite 影响登录和播放。

[Script]
spotify-proto = type=http-response,pattern=^https:\/\/(spclient\.wg\.spotify\.com|gae2-spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)(\?.*)?$,requires-body=true,binary-body-mode=true,max-size=1048576,script-path=https://raw.githubusercontent.com/fyylflh/nextinrule/main/spotify-proto.js,script-update-interval=0,enable=true

[MITM]
hostname = spclient.wg.spotify.com, gae2-spclient.wg.spotify.com, *spclient.spotify.com
