# 2025.6.27 部分解锁premium,音质不能设置为超高(建议登录后再打开脚本,重启app等待脚本生效)
# 仓库地址 https://github.com/daozen/rules
# 功能: 1.去除播放广告 2.歌手/专辑列表正常展示 3.去除随机播放

[URL Rewrite]
^https:\/\/((?:spclient\.wg\.spotify\.com|gae2-spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com))(?:\:443)?\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/([^?]+)\?([^#]*?)platform=iphone([^#]*)$ https://$1/$2/$3?$4platform=ipad$5 header
^https:\/\/((?:spclient\.wg\.spotify\.com|gae2-spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com))\:443\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/(.+)$ https://$1/$2/$3 header

[Script]
spotify-proto = type=http-response,pattern=^https:\/\/(spclient\.wg\.spotify\.com|gae2-spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$,requires-body=true,binary-body-mode=true,max-size=0,script-path=https://raw.githubusercontent.com/daozen/rules/master/js/spotify-proto.js,script-update-interval=0,enable=false

[MITM]
hostname = spclient.wg.spotify.com, gae2-spclient.wg.spotify.com, *spclient.spotify.com
